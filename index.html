<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>IMPOSSIBLE REMI</title><link rel="stylesheet" href="./src/style.css" /></head>
<body>
<div id="app">
  <header id="topbar">
    <div id="hud"></div>
    <div id="toolbar">
      <button id="leaveBtn" data-i18n-title="online.leave" style="display:none">🚪</button>
      <button id="helpBtn" data-i18n-title="help.btn">❓</button>
      <button id="musicBtn" title="Music">🎵</button>
      <button id="sfxBtn" title="SFX">🔊</button>
      <button id="sizeBtn" data-i18n-title="size.btn">🔍 L</button>
      <button id="logBtn" data-i18n-title="log.btn">📜</button>
      <button id="langBtn" data-i18n-title="lang.btn">🌐 ID</button>
    </div>
  </header>
  <main id="stage">
    <div id="view"><canvas id="c"></canvas></div>
    <aside id="log"><div class="lh" data-i18n="log.title"></div><div id="logList"></div></aside>
  </main>
  <footer id="bottombar">
    <div id="status"></div>
    <div id="msg"></div>
    <div id="actions">
      <button id="meldModeBtn"></button>
      <button id="doMeldBtn" data-i18n="btn.doMeld"></button>
      <button id="cancelEatBtn" data-i18n="btn.cancel"></button>
      <button id="closeRoundBtn" data-i18n="btn.close"></button>
    </div>
  </footer>
</div>
<div id="ov"></div>
<div id="rotate"><div class="rot-ic">📱↻</div><p data-i18n="rotate.msg"></p></div>
<script type="module" src="./src/main.js"></script>
</body></html>
